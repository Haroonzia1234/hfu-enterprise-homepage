<section class="section section--white stats" data-section="stats" aria-labelledby="stats-title">
  <h2 class="visually-hidden" id="stats-title">Key statistics</h2>
  <div class="container">
    <div class="stats__grid">
      <div class="stats__item">
        <div class="stats__value" data-count-to="200" data-count-suffix="+">
          <span class="stats__number">200</span><span class="stats__suffix">+</span>
        </div>
        <div class="stats__label">trusted clients</div>
      </div>
      <div class="stats__item">
        <div class="stats__value" data-count-to="7" data-count-suffix="+">
          <span class="stats__number">7</span><span class="stats__suffix">+</span>
        </div>
        <div class="stats__label">years of experience</div>
      </div>
      <div class="stats__item">
        <div class="stats__value" data-count-to="10" data-count-suffix="K+">
          <span class="stats__number">10</span><span class="stats__suffix">K+</span>
        </div>
        <div class="stats__label">jobs successfully completed</div>
      </div>
      <div class="stats__item">
        <div class="stats__value">
          <span class="stats__number">24/7</span>
        </div>
        <div class="stats__label">office hours, every day</div>
      </div>
    </div>
  </div>
  <div class="stats__marquee" aria-label="Specialist capabilities">
    <div class="stats__marquee-track">
      <div class="stats__marquee-group">
        <span class="stats__marquee-item">Logistics</span>
        <svg class="stats__marquee-chevron icon" aria-hidden="true" focusable="false">
          <use href="#icon-chevron-right"></use>
        </svg>
        <span class="stats__marquee-item">Cargo</span>
        <svg class="stats__marquee-chevron icon" aria-hidden="true" focusable="false">
          <use href="#icon-chevron-right"></use>
        </svg>
        <span class="stats__marquee-item">Freight</span>
        <svg class="stats__marquee-chevron icon" aria-hidden="true" focusable="false">
          <use href="#icon-chevron-right"></use>
        </svg>
        <span class="stats__marquee-item">Transportation</span>
        <svg class="stats__marquee-chevron icon" aria-hidden="true" focusable="false">
          <use href="#icon-chevron-right"></use>
        </svg>
        <span class="stats__marquee-item">Delivery</span>
        <svg class="stats__marquee-chevron icon" aria-hidden="true" focusable="false">
          <use href="#icon-chevron-right"></use>
        </svg>
      </div>
      <div class="stats__marquee-group" aria-hidden="true">
        <span class="stats__marquee-item">Logistics</span>
        <svg class="stats__marquee-chevron icon" aria-hidden="true" focusable="false">
          <use href="#icon-chevron-right"></use>
        </svg>
        <span class="stats__marquee-item">Cargo</span>
        <svg class="stats__marquee-chevron icon" aria-hidden="true" focusable="false">
          <use href="#icon-chevron-right"></use>
        </svg>
        <span class="stats__marquee-item">Freight</span>
        <svg class="stats__marquee-chevron icon" aria-hidden="true" focusable="false">
          <use href="#icon-chevron-right"></use>
        </svg>
        <span class="stats__marquee-item">Transportation</span>
        <svg class="stats__marquee-chevron icon" aria-hidden="true" focusable="false">
          <use href="#icon-chevron-right"></use>
        </svg>
        <span class="stats__marquee-item">Delivery</span>
        <svg class="stats__marquee-chevron icon" aria-hidden="true" focusable="false">
          <use href="#icon-chevron-right"></use>
        </svg>
      </div>
    </div>
  </div>
</section>
