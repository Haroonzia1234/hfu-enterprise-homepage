<!DOCTYPE html>
<html lang="en-GB">
<head>
  <script>document.documentElement.classList.add('js');</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  {{ROBOTS}}
  <link rel="canonical" href="{{CANONICAL}}">
  <meta name="theme-color" content="#0b1324">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:image" content="{{SITE_URL}}assets/img/og-image.png">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{SITE_URL}}assets/img/og-image.png">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/montserrat-latin-wght-italic.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/montserrat-latin-wght-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="assets/fonts/inter-latin-wght-normal.woff2">
  <link rel="stylesheet" href="css/styles.css?v={{CSS_HASH}}">
  {{JSON_LD}}
</head>
<body>
  {{> sprite}}
  <a class="skip-link" href="#main">Skip to main content</a>
  {{> header}}
  <main id="main">
    {{> hero}}
    {{> stats}}
    {{> services}}
    {{> fleet}}
    {{> how}}
    {{> business}}
    {{> coverage}}
    {{> why}}
    {{> reviews}}
    {{> quote}}
    {{> faq}}
  </main>
  {{> footer}}
  <div class="visually-hidden" id="live-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/main.js?v={{JS_HASH}}"></script>
</body>
</html>
